services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - ./web/.env.local
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      AGENT_URL: http://agent:3000
      SERVER_ACTION_ALLOWED_ORIGINS: localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      agent:
        condition: service_healthy
